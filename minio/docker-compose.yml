services:
  minio:
    image: minio/minio
    container_name: dev_minio
    restart: always
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: adminpass
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "8086:9001"
    volumes:
      - minio_data:/data

volumes:
  minio_data:
    driver: local