services:
  mysql:
    image: mysql:8
    container_name: dev_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      # MYSQL_DATABASE: my_app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dev_phpmyadmin
    restart: always
    ports:
      - "8087:80" 
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: admin
      PMA_ARBITRARY: 1 
    depends_on:
      - mysql 

volumes:
  mysql_data:
    driver: local
